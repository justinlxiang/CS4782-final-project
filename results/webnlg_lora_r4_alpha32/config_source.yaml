# Config for GPT-2 Medium + LoRA + WebNLG replication.
# Hyperparameters from Hu et al. 2021, Table 11 (WebNLG column). The WebNLG
# column is identical to E2E for every value that affects optimization
# (dropout 0.1, weight decay 0.01, label smoothing 0.1, rank 4, alpha 32,
# AdamW LR 2e-4, batch 8, 5 epochs, warmup 500). Only paths and run name
# change relative to the E2E config.

project:
  name: lora-gpt2-medium-webnlg
  output_dir: outputs/runs/webnlg_lora_r4_alpha32
  seed: 110

model:
  name_or_path: gpt2-medium
  tokenizer_name_or_path: gpt2-medium
  pad_token: eos_token
  freeze_base_model: true

lora:
  target_model: gpt2
  target_modules:
    attention_c_attn:
      query: true
      key: false
      value: true
  rank: 4
  alpha: 32
  dropout: 0.1
  merge_for_eval: false

data:
  dataset_name: webnlg
  raw_dir: data/raw/webnlg
  processed_dir: data/processed/webnlg_gpt2
  max_length: 512
  prompt_template: "{mr}"
  append_bos_to_context: true
  append_eos_to_target: true
  mask_prompt_labels: true
  add_leading_space_to_target: true

training:
  optimizer: adamw
  learning_rate: 0.0002
  weight_decay: 0.01
  adam_epsilon: 0.000001
  batch_size: 8
  validation_batch_size: 4
  gradient_accumulation_steps: 1
  epochs: 5
  warmup_steps: 500
  lr_schedule: linear
  label_smoothing: 0.1
  max_grad_norm: 0.0
  mixed_precision: fp16
  eval_every_steps: 1000
  save_every_steps: 1000
  save_adapter_only: true

generation:
  split: test
  decoder: hf_generate
  batch_size: 4
  max_new_tokens: 64
  num_beams: 10
  length_penalty: 0.8
  no_repeat_ngram_size: 4
  repetition_penalty: 1.0
  early_stopping: true
  eos_token_id:
    - 50256
    - 628

evaluation:
  metrics:
    - bleu
    - meteor
    - ter
  official_e2e_script_dir: external/webnlg-metrics
  predictions_file: outputs/runs/webnlg_lora_r4_alpha32/generations_test.txt
  references_file: data/processed/webnlg_gpt2/references_test.txt
