[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs4782-lora-gpt2"
version = "0.1.0"
description = "From-scratch LoRA replication code for GPT-2 Medium on E2E NLG."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
