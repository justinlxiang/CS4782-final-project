# MoLE config: 3 frozen LoRA experts (E2E, DART, WebNLG) + per-layer router.
# The expert checkpoints below were produced by single-task LoRA training
# runs in this same repo (configs/{e2e,dart,webnlg}_*_lora.yaml). The router
# is the only trainable component here.

project:
  name: mole-e2e-dart-webnlg
  output_dir: outputs/runs/mole_e2e_dart_webnlg
  seed: 110

model:
  name_or_path: gpt2-medium
  tokenizer_name_or_path: gpt2-medium
  pad_token: eos_token
  freeze_base_model: true

# These four `lora.*` fields are reused by the MoLE injection so each
# expert slot has identical shape to the underlying single-task adapters.
# Only `dropout` may differ from any single expert's training-time dropout
# because dropout is not stored in the adapter checkpoint anyway.
lora:
  target_model: gpt2
  target_modules:
    attention_c_attn:
      query: true
      key: false
      value: true
  rank: 4
  alpha: 32
  dropout: 0.0

mole:
  # Order of this list is the expert index ordering used by the router and
  # by `force_expert_weights` at eval time.
  expert_paths:
    - e2e_lora_r4_alpha32/checkpoints/adapter_final.pt
    - dart_lora_r4_alpha32/checkpoints/adapter_final.pt
    - webnlg_lora_r4_alpha32/checkpoints/adapter_final.pt
  expert_names:
    - e2e
    - dart
    - webnlg
  # Switch-Transformer style hard routing: per token, pick the argmax
  # expert and scale its contribution by its own softmax probability.
  # Non-chosen experts contribute 0 to the output. The probability
  # multiplier carries gradient back to the gate.
  routing_mode: top1
  # gate_init defaults to "random" for top1 (so argmax has variation to
  # break ties); set explicitly here only if you want to override.
  # gate_init: random

# The training set is a concatenation of the per-task processed JSONL
# train splits, each tokenized with the same gpt2-medium tokenizer that
# the experts were trained with. Validation is a similar concatenation.
data:
  dataset_name: mole_mixed
  task_splits:
    - name: e2e
      processed_dir: ../data/processed/e2e_gpt2
      train_file: train.jsonl
      valid_file: valid.jsonl
    - name: dart
      processed_dir: ../data/processed/dart_gpt2
      train_file: train.jsonl
      valid_file: valid.jsonl
    - name: webnlg
      processed_dir: ../data/processed/webnlg_gpt2
      train_file: train.jsonl
      valid_file: valid.jsonl
  max_length: 512

training:
  optimizer: adamw
  learning_rate: 0.0005     # router is tiny; we can afford a higher LR
  weight_decay: 0.0
  adam_epsilon: 0.000001
  batch_size: 8
  validation_batch_size: 4
  gradient_accumulation_steps: 1
  epochs: 2                 # router converges fast on top of frozen experts
  warmup_steps: 200
  lr_schedule: linear
  label_smoothing: 0.0
  max_grad_norm: 1.0
  mixed_precision: fp16
  eval_every_steps: 1000
  save_every_steps: 1000
